<div
  class="min-h-screen w-full bg-gradient-to-b from-slate-950 to-slate-900 flex items-center justify-center px-4"
>
  <div
    class="w-full max-w-md bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl ring-1 ring-white/20 p-8"
  >
    <!-- Header -->
    <div class="flex flex-col items-center mb-8">
      <span class="text-4xl mb-3">🏏</span>
      <h1 class="text-2xl font-bold text-white tracking-tight">RunMeter Admin</h1>
      <p class="text-gray-400 text-sm mt-1 text-center">
        Sign in to manage live match scores
      </p>
    </div>

    <!-- Login form -->
    <form [formGroup]="form" (ngSubmit)="login()" class="space-y-5">

      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Username
        </label>
        <input
          type="text"
          formControlName="username"
          placeholder="admin"
          autocomplete="username"
          class="w-full bg-slate-800 border border-white/10 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-yellow-400/50 placeholder-gray-600"
          [class.border-red-500]="form.get('username')?.invalid && form.get('username')?.touched"
        />
        <p
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
          class="text-red-400 text-xs mt-1"
        >
          Username is required.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Password
        </label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full bg-slate-800 border border-white/10 text-white rounded-xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-yellow-400/50 placeholder-gray-600"
            [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition text-lg leading-none"
            tabindex="-1"
          >
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <p
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          class="text-red-400 text-xs mt-1"
        >
          Password is required.
        </p>
      </div>

      <!-- Invalid credentials error -->
      <div
        *ngIf="loginError"
        class="flex items-center gap-2 bg-red-900/30 border border-red-500/30 rounded-xl px-4 py-3 text-sm text-red-300"
      >
        <span>⚠️</span>
        <span>Invalid username or password. Please try again.</span>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full py-3 rounded-xl font-bold text-gray-900 bg-gradient-to-r from-yellow-400 to-orange-500 hover:shadow-yellow-500/40 hover:shadow-lg transition disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Login
      </button>
    </form>

    <p class="text-center text-xs text-gray-600 mt-6">
      Session cleared when tab closes.
    </p>
  </div>
</div>
